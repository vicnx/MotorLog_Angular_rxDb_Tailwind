<div class="flex justify-end items-center mb-3 w-full">
	<button 
		type="button"
		(click)="toggleFilters()" 
		class="btn-secondary flex items-center gap-2 py-2 px-3.5"
	>
		<i class="fas fa-filter text-primary-500"></i>
		<span class="text-xs font-semibold">Filtros</span>
		<i [ngClass]="filtersVisible ? 'fas fa-chevron-up' : 'fas fa-chevron-down'" class="text-[10px] ml-1 text-gray-400"></i>
	</button>
</div>

<div @fadeInOut *ngIf="filtersVisible" class="mb-4 relative z-20">
	<div class="card-container p-4 md:p-5">
		<h4 class="text-xs font-bold text-gray-700 dark:text-gray-200 mb-3 flex items-center gap-2 uppercase tracking-wider">
			<i class="fas fa-calendar-alt text-primary-500"></i> Rango de fechas
		</h4>
		
		<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-2">
			<div>
				<label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1 ml-0.5">Desde</label>
				<p-calendar [(ngModel)]="startDate" [placeholder]="'pages.home.filters.desde' | translate" [showIcon]="true" [style]="{'width':'100%'}" [inputStyle]="{'width':'100%'}"></p-calendar>
			</div>
			<div>
				<label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1 ml-0.5">Hasta</label>
				<p-calendar [(ngModel)]="endDate" [placeholder]="'pages.home.filters.hasta' | translate" [showIcon]="true" [style]="{'width':'100%'}" [inputStyle]="{'width':'100%'}"></p-calendar>
			</div>
		</div>

		<div class="flex justify-end gap-2 border-t border-gray-100 dark:border-gray-700/60 pt-3 mt-4">
			<button 
				type="button" 
				(click)="resetFilters()" 
				class="btn-secondary text-xs py-2 px-3 flex items-center gap-1.5"
				title="{{ 'pages.home.filters.reset_filters' | translate }}"
			>
				<i class="fas fa-undo"></i>
				<span>Reset</span>
			</button>

			<button 
				type="button" 
				(click)="applyFilters()" 
				class="btn-primary text-xs py-2 px-4 flex items-center gap-1.5"
				title="{{ 'pages.home.filters.apply_filters' | translate }}"
			>
				<i class="fas fa-check"></i>
				<span>Aplicar</span>
			</button>
		</div>
	</div>
</div>
