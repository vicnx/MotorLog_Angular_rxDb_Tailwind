<div class="mb-4">
	<label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1.5">
		{{ label }}
	</label>

	<!-- Botón Seleccionar Imagen (p-fileUpload con estilos del sistema de diseño) -->
	<div *ngIf="!modoConsulta" class="mb-2">
		<p-fileUpload 
			#fileUpload 
			name="imagen" 
			(onSelect)="onFileUpload($event)" 
			(onRemove)="onRemoveImage()" 
			mode="basic" 
			accept="image/*"
			chooseLabel="Seleccionar Imagen"
			chooseIcon="fas fa-upload"
			styleClass="!rounded-xl !bg-gray-100 hover:!bg-gray-200 dark:!bg-gray-700 dark:hover:!bg-gray-600 !text-gray-800 dark:!text-gray-200 !border !border-gray-200/80 dark:!border-gray-700/80 !text-xs !font-medium !py-2 !px-4 cursor-pointer"
		>
		</p-fileUpload>
	</div>

	<!-- Previsualización de Imagen si existe -->
	<div *ngIf="imageControl.value" class="relative inline-block mt-2 group">
		<img
			[src]="imageControl.value"
			alt="Imagen seleccionada"
			class="rounded-2xl shadow-sm object-cover w-40 h-40 border border-gray-200/80 dark:border-gray-700/80 cursor-pointer transition-transform hover:scale-[1.02]"
			(click)="openModal()"
		/>

		<!-- Botón Borrar -->
		<button
			*ngIf="!modoConsulta"
			type="button"
			class="absolute top-2 right-2 w-8 h-8 bg-white dark:bg-gray-800 text-red-500 hover:text-red-700 rounded-full shadow-md border border-gray-200 dark:border-gray-700 flex items-center justify-center transition active:scale-95"
			(click)="onRemoveImage()"
			title="Eliminar imagen"
		>
			<i class="fas fa-trash text-xs"></i>
		</button>

		<!-- Botón Descargar -->
		<button
			type="button"
			class="absolute bottom-2 right-2 w-8 h-8 bg-white dark:bg-gray-800 text-primary-500 hover:text-primary-600 rounded-full shadow-md border border-gray-200 dark:border-gray-700 flex items-center justify-center transition active:scale-95"
			(click)="downloadImage()"
			title="Descargar imagen"
		>
			<i class="fas fa-download text-xs"></i>
		</button>
	</div>

	<!-- Mensaje informativo en modo consulta cuando no hay imagen -->
	<div *ngIf="modoConsulta && !imageControl.value" class="mt-1 p-3 rounded-xl bg-gray-50 dark:bg-gray-800/60 border border-dashed border-gray-200 dark:border-gray-700 text-center">
		<span class="text-xs text-gray-400 dark:text-gray-500 italic flex items-center justify-center gap-1.5">
			<i class="fas fa-image"></i>
			<span>Sin imagen adjunta</span>
		</span>
	</div>
</div>

<!-- Modal para ampliar la imagen -->
<div *ngIf="showModal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-[99999] p-4" (click)="closeModal()">
	<div class="bg-white dark:bg-gray-800 rounded-2xl p-4 relative max-w-2xl w-full shadow-2xl border border-gray-200 dark:border-gray-700" (click)="$event.stopPropagation()">
		<button type="button" class="absolute top-3 right-3 w-8 h-8 text-gray-400 hover:text-gray-600 dark:hover:text-white rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center transition" (click)="closeModal()">
			<i class="fas fa-times text-sm"></i>
		</button>
		<div class="p-2 flex items-center justify-center">
			<img [src]="imageControl.value" alt="Imagen ampliada" class="max-w-full max-h-[75vh] rounded-xl object-contain" />
		</div>
	</div>
</div>
