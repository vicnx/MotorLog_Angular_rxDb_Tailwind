<p-dialog
    header="{{ 'backup.dialog.title' | translate }}"
    [(visible)]="displayDialog"
    [modal]="true"
    [closable]="false"
    [responsive]="true"
    [style]="{ width: '380px', maxWidth: 'calc(100vw - 2.5rem)' }"
>
    <div class="text-center p-3">
        <div class="w-12 h-12 rounded-2xl bg-primary-50 dark:bg-primary-950/40 text-primary-500 flex items-center justify-center text-xl mx-auto mb-3 border border-primary-100 dark:border-primary-900/30">
            <i class="fas fa-database"></i>
        </div>
        <p class="text-xs text-gray-700 dark:text-gray-200 font-medium leading-relaxed">{{ 'backup.dialog.message' | translate }}</p>
        <p class="mt-2 text-[11px] text-gray-500 dark:text-gray-400 leading-normal">{{ 'backup.dialog.warning' | translate }}</p>
    </div>

    <ng-template pTemplate="footer">
        <div class="w-full flex flex-col gap-2 p-0">
            <!-- Botón 1: Ir a Ajustes para hacer copia de seguridad -->
            <button
                type="button"
                (click)="goToSettings()"
                class="btn-primary !py-2.5 !px-3 text-xs w-full flex items-center justify-center gap-2"
            >
                <i class="fas fa-cog text-xs"></i>
                <span>{{ 'backup.dialog.go_to_settings' | translate }}</span>
            </button>

            <!-- Botón 2: Cancelar / Ahora no -->
            <button
                type="button"
                (click)="hideDialog()"
                class="w-full text-xs text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 font-semibold transition text-center pt-1"
            >
                {{ 'backup.dialog.not_now' | translate }}
            </button>
        </div>
    </ng-template>
</p-dialog>
