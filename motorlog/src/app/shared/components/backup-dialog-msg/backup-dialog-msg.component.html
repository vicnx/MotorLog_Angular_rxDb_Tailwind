<p-dialog
    header="{{ 'backup.dialog.title' | translate }}"
    [(visible)]="displayDialog"
    [modal]="true"
    [closable]="false"
    [responsive]="true"
    [style]="{ width: '380px', maxWidth: 'calc(100vw - 2.5rem)' }"
>
    <div class="text-center p-3">
        <div class="w-12 h-12 rounded-2xl bg-primary-50 dark:bg-primary-950/40 text-primary-500 flex items-center justify-center text-xl mx-auto mb-3 border border-primary-100 dark:border-primary-900/30">
            <i class="fas fa-database"></i>
        </div>
        <p class="text-xs text-gray-700 dark:text-gray-200 font-medium leading-relaxed">{{ 'backup.dialog.message' | translate }}</p>
        <p class="mt-2 text-[11px] text-gray-500 dark:text-gray-400 leading-normal">{{ 'backup.dialog.warning' | translate }}</p>
    </div>

    <p-footer>
        <div class="flex flex-col gap-2 p-1">
            <!-- Botón 1: Guardar copia en Google Drive -->
            <button
                type="button"
                (click)="uploadToGDrive()"
                class="btn-primary !bg-emerald-600 hover:!bg-emerald-700 !py-2.5 !px-3 text-xs w-full flex items-center justify-center gap-2"
            >
                <img src="assets/images/google-drive.png" alt="Google Drive" class="w-4 h-4 object-contain" />
                <span>{{ 'backup.dialog.gdrive' | translate }}</span>
            </button>

            <!-- Botón 2: Descargar JSON local -->
            <button
                type="button"
                (click)="exportData()"
                class="btn-secondary !py-2.5 !px-3 text-xs w-full flex items-center justify-center gap-2"
            >
                <i class="fas fa-file-download text-primary-500"></i>
                <span>{{ 'backup.dialog.download_local' | translate }}</span>
            </button>

            <!-- Botón 3: Cancelar -->
            <button
                type="button"
                (click)="hideDialog()"
                class="text-xs text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 font-semibold transition text-center pt-1"
            >
                {{ 'backup.dialog.cancel' | translate }}
            </button>
        </div>
    </p-footer>
</p-dialog>
