<p-dialog [header]="'userActions.generateAvatar.title' | translate" [(visible)]="visible" [modal]="true" [closable]="true" (onHide)="onDialogClose()" [style]="{ width: '380px', maxWidth: 'calc(100vw - 2.5rem)' }">
  <div class="flex flex-col items-center p-2 text-center">
    <div class="relative my-3">
      <img [src]="newAvatar" [alt]="'userActions.generateAvatar.title' | translate" class="h-28 w-28 rounded-full shadow-md border-4 border-primary-500/20 ring-4 ring-primary-500/10 object-cover" />
    </div>
    <p class="text-xs text-gray-600 dark:text-gray-300 text-center mb-5 font-medium leading-relaxed">
      {{ 'userActions.generateAvatar.msg' | translate }}
    </p>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 w-full mt-1">
      <button type="button" (click)="onGenerateAnother()" class="btn-secondary !py-2 !px-3 text-xs w-full">
        {{ 'userActions.generateAvatar.generateOther' | translate }}
      </button>
      <button type="button" (click)="onApply()" class="btn-primary !py-2 !px-3 text-xs w-full">
        {{ 'userActions.generateAvatar.apply' | translate }}
      </button>
    </div>
  </div>
</p-dialog>
