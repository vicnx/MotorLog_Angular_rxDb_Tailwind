<!-- Dock de navegación flotante: píldora centrada en todas las resoluciones -->
<nav
  class="fixed bottom-4 left-1/2 -translate-x-1/2 z-40
         w-[calc(100%-2rem)] max-w-sm
         bg-white/90 dark:bg-gray-900/90 backdrop-blur-md
         rounded-2xl border border-gray-200/80 dark:border-gray-700/80
         shadow-xl px-2 py-1.5
         sm:max-w-md sm:px-3 sm:py-2
         pb-[max(0.375rem,env(safe-area-inset-bottom))]"
>
  <div class="flex items-center justify-around sm:gap-1">
    <a
      *ngFor="let tab of tabs"
      [routerLink]="tab.route"
      routerLinkActive="active-tab"
      class="flex flex-col items-center justify-center flex-1 sm:flex-none
             py-2 px-3 sm:px-4 sm:py-2 rounded-xl
             text-gray-500 dark:text-gray-400
             hover:text-gray-900 dark:hover:text-gray-200
             transition-all duration-200 group"
      [routerLinkActiveOptions]="{ exact: false }"
    >
      <i [class]="tab.icon"
         class="text-lg mb-0.5 transition-colors duration-200
                group-[.active-tab]:text-primary-500 dark:group-[.active-tab]:text-primary-400">
      </i>
      <span class="text-[0.65rem] sm:text-xs leading-tight transition-colors duration-200
                    group-[.active-tab]:text-primary-500 dark:group-[.active-tab]:text-primary-400
                    group-[.active-tab]:font-semibold">
        {{ tab.labelKey | translate }}
      </span>
    </a>
  </div>
</nav>
