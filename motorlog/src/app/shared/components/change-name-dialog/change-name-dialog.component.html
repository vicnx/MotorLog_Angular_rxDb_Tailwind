<p-dialog [header]="'userActions.changeName.title' | translate" [(visible)]="visible" [modal]="true" [closable]="true" (onHide)="onDialogClose()" [style]="{ width: '380px', maxWidth: 'calc(100vw - 2.5rem)' }">
	<div class="flex flex-col items-center p-2 text-left">
		<p class="text-xs text-gray-600 dark:text-gray-300 mb-3 w-full font-medium leading-relaxed">
			{{ 'userActions.changeName.msg' | translate }}
		</p>

		<div class="w-full mt-2">
			<label class="input-label">{{ 'userActions.changeName.label' | translate }}</label>
			<input
				[(ngModel)]="newName"
				type="text"
				class="input-field text-left"
				placeholder="{{ 'userActions.changeName.placeholder' | translate }}"
			/>
		</div>

		<div class="flex justify-end w-full mt-5">
			<button type="button" (click)="onApply()" class="btn-primary w-full">
				{{ 'userActions.changeName.apply' | translate }}
			</button>
		</div>
	</div>
</p-dialog>
