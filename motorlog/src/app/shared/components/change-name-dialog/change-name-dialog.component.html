<p-dialog [header]="'userActions.changeName.title' | translate" [(visible)]="visible" [modal]="true" [closable]="true" (onHide)="onDialogClose()" [style]="{ width: '380px', maxWidth: '90vw' }">
	<div class="flex flex-col items-center p-2">
		<p class="text-sm text-gray-600 dark:text-gray-300 text-center">{{ 'userActions.changeName.msg' | translate }}</p>

		<div class="w-full mt-4">
			<label class="block mb-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300">{{ 'userActions.changeName.label' | translate }}</label>
			<input
				[(ngModel)]="newName"
				type="text"
				class="input-field text-left"
				placeholder="{{ 'userActions.changeName.placeholder' | translate }}"
			/>
		</div>

		<div class="flex justify-end w-full mt-6 gap-2">
			<button type="button" (click)="onApply()" class="btn-primary w-full">
				{{ 'userActions.changeName.apply' | translate }}
			</button>
		</div>
	</div>
</p-dialog>
