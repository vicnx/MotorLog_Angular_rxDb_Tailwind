<p-dialog
	header="{{ 'welcome.warning.title' | translate }}"
	[(visible)]="displayDialog"
	[modal]="true"
	[closable]="false"
	[responsive]="true"
	[style]="{ width: '380px', maxWidth: 'calc(100vw - 2.5rem)' }"
>
	<div class="text-center p-3">
		<div class="w-12 h-12 rounded-2xl bg-amber-50 dark:bg-amber-950/40 text-amber-500 flex items-center justify-center text-xl mx-auto mb-3 border border-amber-200/60 dark:border-amber-900/40">
			<i class="fas fa-exclamation-triangle"></i>
		</div>
		<p class="text-xs text-gray-700 dark:text-gray-200 font-medium leading-relaxed font-sans">
			{{ 'welcome.warning.message_1' | translate }}
		</p>
		<p class="mt-2 text-xs text-gray-500 dark:text-gray-400 font-sans">
			{{ 'welcome.warning.message_2' | translate }}
		</p>
	</div>
	<p-footer>
		<button
			type="button"
			(click)="hideDialog()"
			class="btn-primary w-full flex items-center justify-center gap-2"
		>
			<span>{{ 'welcome.continue' | translate }}</span>
		</button>
	</p-footer>
</p-dialog>
