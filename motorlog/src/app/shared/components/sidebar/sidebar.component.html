<p-sidebar [(visible)]="show" (onHide)="hideSidebar()" [showCloseIcon]="true" [fullScreen]="true" [baseZIndex]="10000">
	<div class="mx-auto max-w-screen-md px-4 py-4">
		<div class="flex w-full items-center justify-center gap-2 mb-8">
			<span class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight">
				{{ const.appName }} <span class="text-primary-500">🚗</span>
			</span>
		</div>

		<ul class="space-y-2">
			<li *ngFor="let menuItem of menuItems" (click)="hideSidebar()">
				<a
					class="inline-flex items-center w-full px-4 py-3 text-sm font-medium transition-all duration-200 rounded-xl cursor-pointer"
					[ngClass]="pageSelected === menuItem.route ? 'bg-primary-50 text-primary-600 dark:bg-primary-950/40 dark:text-primary-400 font-semibold' : 'text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800'"
					[routerLink]="menuItem.route"
				>
					<i class="w-6 fas text-base text-primary-500" [ngClass]="menuItem.icon"></i>
					<span class="ml-2">{{ menuItem.name | translate }}</span>
				</a>
			</li>
		</ul>
	</div>

	<ng-template pTemplate="footer">
		<div class="mt-auto mx-auto max-w-screen-md px-4 py-4 border-t border-gray-100 dark:border-gray-800">
			<div class="flex items-center justify-center mb-4">
				<app-lang-dropdown></app-lang-dropdown>
			</div>
			
			<div class="flex items-center justify-between bg-gray-50 dark:bg-gray-800/80 p-3 rounded-2xl border border-gray-200/60 dark:border-gray-700/60">
				<div class="flex items-center gap-3">
					<img [src]="userSvc.user().avatar" class="h-9 w-9 rounded-full object-cover border border-primary-500/30" alt="Avatar" />
					<span class="font-semibold text-sm text-gray-900 dark:text-white truncate max-w-[140px]">{{ userSvc.user().name }}</span>
				</div>
				<div class="flex items-center gap-1">
					<button type="button" (click)="openSettings()" class="p-2 text-gray-500 hover:text-primary-500 dark:text-gray-400 dark:hover:text-primary-400 rounded-lg transition">
						<i class="fas fa-cog text-lg"></i>
					</button>
					<button type="button" (click)="logout()" class="p-2 text-red-500 hover:text-red-700 dark:text-red-400 rounded-lg transition">
						<i class="fas fa-sign-out-alt text-lg"></i>
					</button>
				</div>
			</div>
		</div>
	</ng-template>
</p-sidebar>
