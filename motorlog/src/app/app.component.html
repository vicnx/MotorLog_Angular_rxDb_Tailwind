<ngx-spinner bdColor="rgba(51,51,51,0.8)" size="large" color="#10b981" type="ball-clip-rotate" [fullScreen]="true"></ngx-spinner>
<div [ngClass]="{ 'pb-20': userSvc.isUserLogged() }">
    <app-navbar *ngIf="userSvc.isUserLogged()"></app-navbar>
    <router-outlet></router-outlet>
    <p-confirmDialog key="confirmDialog" [style]="{ width: '440px', maxWidth: 'calc(100vw - 2rem)' }" [breakpoints]="{ '640px': '92vw' }"></p-confirmDialog>
    <app-welcome-dialog-info></app-welcome-dialog-info>
    <app-backup-dialog-msg></app-backup-dialog-msg>
    <p-toast position="bottom-center" key="toast" />
    <app-scroll-to-top></app-scroll-to-top>
</div>
<app-bottom-nav *ngIf="userSvc.isUserLogged()"></app-bottom-nav>
