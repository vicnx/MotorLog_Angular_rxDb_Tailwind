<div class="w-full max-w-screen-md mx-auto px-3 sm:px-4 pt-3 pb-12">
	<!-- Cabecera Superior: Selector de Vehículo y Botón de Filtros lado a lado -->
	<div *ngIf="vehicleSvc.vehicles().length > 0" class="flex items-center justify-between gap-3 mb-4">
		<div class="flex-1 min-w-0">
			<app-vehicle-selector></app-vehicle-selector>
		</div>
		<app-maintenance-filters (onFiltersApplied)="timeline.onFiltersChanged($event)"></app-maintenance-filters>
	</div>

	<app-maintenance-timeline #timeline></app-maintenance-timeline>
</div>
