<div
	[ngClass]="{
		'w-full max-w-screen-md mx-auto px-3 sm:px-4 py-4 pb-12': !ref,
		'w-full p-0 bg-transparent': ref
	}"
>
	<div [ngClass]="{ 'card-container': !ref }">
		<form [formGroup]="customLocationForm" (ngSubmit)="onSubmit()" class="space-y-5">
			
			<!-- 1. Nombre de la Ubicación -->
			<div>
				<label class="input-label">
					{{ 'pages.mant-details.add-mant.location_prompt' | translate }} *
				</label>
				<input
					type="text"
					class="input-field"
					[placeholder]="'pages.mant-details.add-mant.location_prompt' | translate"
					formControlName="label"
				/>
				<div *ngIf="customLocationForm?.get('label')?.invalid && customLocationForm?.get('label')?.touched" class="input-error">
					{{ 'pages.mant-details.add-mant.validations.location_required' | translate }}
				</div>
			</div>

			<!-- 2. Botón de Guardar -->
			<div class="pt-2">
				<button type="submit" class="btn-primary w-full flex items-center justify-center gap-2">
					<span>{{ 'pages.custom-services.save' | translate }}</span>
					<i class="fas fa-check text-xs"></i>
				</button>
			</div>
		</form>
	</div>
</div>
