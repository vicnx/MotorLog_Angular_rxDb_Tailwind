<div class="w-full max-w-screen-md mx-auto px-3 sm:px-4 py-4 pb-16">

  <!-- ========================================== -->
  <!-- VISTA 1: AJUSTES PRINCIPAL                  -->
  <!-- ========================================== -->
  <div *ngIf="currentView === 'main'" class="space-y-6 animate-fadeIn">
    
    <!-- 1. Tarjeta de Perfil Rápido -->
    <app-action-row
      [avatarUrl]="userSvc.user().avatar"
      [title]="userSvc.user().name"
      [badge]="'pages.settings.profile'"
      [isStandaloneCard]="true"
      (action)="goToProfile()"
    ></app-action-row>

    <!-- 2. Sección: Almacenamiento y Datos -->
    <div class="space-y-2">
      <span class="px-1 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
        {{ 'pages.settings.data' | translate }}
      </span>

      <div class="card-container !p-0 overflow-hidden divide-y divide-gray-100 dark:divide-gray-700/60 shadow-sm">
        <app-action-row
          icon="fas fa-database"
          iconType="primary"
          [title]="'pages.settings.data'"
          [subtitle]="'pages.settings.data_desc'"
          (action)="goToDataManagement()"
        ></app-action-row>
      </div>
    </div>

    <!-- 3. Sección: Preferencias -->
    <div class="space-y-2">
      <span class="px-1 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
        {{ 'pages.settings.preferences_section' | translate }}
      </span>

      <div class="card-container !p-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-gray-700/60 text-gray-600 dark:text-gray-300 flex items-center justify-center flex-shrink-0 border border-gray-200/60 dark:border-gray-700/60">
            <i class="fas fa-globe text-sm"></i>
          </div>
          <span class="font-bold text-sm text-gray-900 dark:text-white">
            {{ 'lang.title' | translate }}
          </span>
        </div>
        <app-lang-dropdown></app-lang-dropdown>
      </div>
    </div>

    <!-- 4. Sección: Legal y Privacidad -->
    <div class="space-y-2">
      <span class="px-1 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
        {{ 'pages.settings.legal_section' | translate }}
      </span>

      <div class="card-container !p-0 overflow-hidden divide-y divide-gray-100 dark:divide-gray-700/60 shadow-sm">
        <app-action-row
          icon="fas fa-shield-alt"
          iconType="default"
          rightIcon="fas fa-external-link-alt"
          [title]="'pages.settings.privacy'"
          (action)="openPrivacy()"
        ></app-action-row>

        <app-action-row
          icon="fas fa-file-contract"
          iconType="default"
          rightIcon="fas fa-external-link-alt"
          [title]="'pages.settings.terms'"
          (action)="openTerms()"
        ></app-action-row>
      </div>
    </div>

    <!-- 5. Pie de versión de la app -->
    <div class="pt-4 text-center">
      <p class="text-xs text-gray-400 dark:text-gray-500 font-medium">
        {{ const.appName }} v{{ const.appVersion }} • by {{ const.author }}
      </p>
    </div>

  </div>

  <!-- ========================================== -->
  <!-- VISTA 2: SUB-PANTALLA DE GESTIÓN DE DATOS   -->
  <!-- ========================================== -->
  <app-data-management
    *ngIf="currentView === 'data'"
    (back)="backToMainSettings()"
  ></app-data-management>

</div>
