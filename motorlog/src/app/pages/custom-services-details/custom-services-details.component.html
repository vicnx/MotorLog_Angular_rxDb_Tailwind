<div
	[ngClass]="{
		'w-full max-w-screen-md mx-auto px-3 sm:px-4 py-4 pb-12': !ref,
		'w-full p-0 bg-transparent': ref
	}"
>
	<div [ngClass]="{ 'card-container': !ref }">
		<form [formGroup]="customServiceForm" (ngSubmit)="onSubmit()" class="space-y-5">
			
			<!-- 1. Nombre del Servicio -->
			<div>
				<label class="input-label">{{ 'pages.custom-services.label' | translate }} *</label>
				<input
					type="text"
					class="input-field"
					[placeholder]="'pages.custom-services.label' | translate"
					formControlName="label"
					[readonly]="isConsulta"
				/>
				<div *ngIf="customServiceForm?.get('label')?.invalid && customServiceForm?.get('label')?.touched" class="input-error">
					{{ 'pages.custom-services.validations.label_required' | translate }}
				</div>
			</div>

			<!-- 2. Color del Servicio -->
			<div>
				<label class="input-label">{{ 'pages.custom-services.color' | translate }}</label>
				
				<div 
					class="input-field flex items-center justify-between h-[42px] !py-0 cursor-pointer select-none"
					[ngClass]="{ 'is-readonly': isConsulta }"
					(click)="!isConsulta && openColorPicker(colorPicker, $event)"
				>
					<div class="flex items-center gap-3">
						<p-colorPicker #colorPicker formControlName="color" [disabled]="isConsulta"></p-colorPicker>
						<span class="text-xs font-mono font-semibold text-gray-800 dark:text-gray-200 uppercase select-none">
							{{ customServiceForm.get('color')?.value }}
						</span>
					</div>

					<div 
						class="w-5 h-5 rounded-full border border-gray-200 dark:border-gray-700 shadow-xs flex-shrink-0" 
						[style.backgroundColor]="customServiceForm.get('color')?.value"
					></div>
				</div>
			</div>

			<!-- 3. Selector de Icono (Grid Táctil) -->
			<div>
				<label class="input-label">
					{{ 'pages.custom-services.icon' | translate }} *
				</label>

				<div class="grid grid-cols-4 sm:grid-cols-6 gap-2.5 p-3.5 rounded-2xl border border-gray-200/80 dark:border-gray-700/80 bg-gray-50/60 dark:bg-gray-900/40 max-h-44 overflow-y-auto">
					<button
						type="button"
						*ngFor="let iconName of optionsIcons"
						(click)="selectIcon(iconName)"
						[disabled]="isConsulta"
						class="h-11 rounded-xl flex items-center justify-center text-xl transition-all duration-150 border select-none disabled:pointer-events-none"
						[ngClass]="customServiceForm.get('icon')?.value === iconName ? 'bg-primary-500 text-white border-primary-600 shadow-sm shadow-primary-500/30 scale-105' : 'bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 border-gray-200/80 dark:border-gray-700/80 hover:border-primary-400 hover:bg-primary-50 dark:hover:bg-primary-950/40'"
						[title]="iconName"
					>
						<i [class]="iconName" [style.color]="customServiceForm.get('icon')?.value === iconName ? '#ffffff' : (customServiceForm.get('color')?.value || '#48d0b0')"></i>
					</button>
				</div>

				<div *ngIf="customServiceForm?.get('icon')?.invalid && customServiceForm?.get('icon')?.touched" class="input-error">
					{{ 'pages.custom-services.validations.icono_required' | translate }}
				</div>
			</div>

			<!-- 4. Botón de Enviar -->
			<div class="pt-2">
				<button type="submit" class="btn-primary w-full flex items-center justify-center gap-2">
					<span>{{ 'pages.custom-services.save' | translate }}</span>
					<i class="fas fa-check text-xs"></i>
				</button>
			</div>
		</form>
	</div>
</div>
