<div class="w-full max-w-screen-md mx-auto px-3 sm:px-4 py-4 pb-12">
  <div class="card-container space-y-5">
    
    <!-- Botón Añadir Servicio Personalizado -->
    <button 
      type="button"
      (click)="goToAddCustomService()" 
      class="btn-primary w-full flex items-center justify-center gap-2"
    >
      <i class="fas fa-plus text-xs"></i>
      <span>{{ 'pages.custom-services.add_customService' | translate }}</span>
    </button>

    <!-- Lista de Servicios Personalizados -->
    @if (this.userSvc.user().customServices.length > 0) {
      <div class="space-y-2.5">
        <div 
          *ngFor="let customService of this.userSvc.user().customServices" 
          class="flex items-center justify-between p-3.5 rounded-xl border border-gray-200/70 dark:border-gray-700/70 bg-white dark:bg-gray-800 hover:border-primary-500/40 hover:bg-gray-50/80 dark:hover:bg-gray-700/50 cursor-pointer transition-all duration-200 shadow-xs group"
        >
          <div class="flex items-center gap-3.5 min-w-0">
            <div class="w-10 h-10 rounded-xl bg-gray-50 dark:bg-gray-700/60 border border-gray-100 dark:border-gray-700 flex items-center justify-center text-lg flex-shrink-0">
              <i [className]="customService.icon" [ngStyle]="{'color': customService.color || '#48d0b0'}"></i>
            </div>

            <span class="font-bold text-sm text-gray-900 dark:text-white truncate">
              {{ customService.label | capitalizeFirst }}
            </span>
          </div>

          <!-- Botón Eliminar Servicio Personalizado -->
          <button 
            type="button"
            (click)="removeCustomService(customService)"
            class="w-8 h-8 rounded-lg text-red-500 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-950/40 border border-transparent hover:border-red-200 dark:hover:border-red-900/50 flex items-center justify-center transition active:scale-95 shrink-0"
            title="Eliminar servicio"
          >
            <i class="fas fa-trash text-xs"></i>
          </button>
        </div>
      </div>
    } @else {
      <!-- Estado Vacío -->
      <div class="flex flex-col items-center justify-center text-center py-10 px-4">
        <div class="w-12 h-12 rounded-2xl bg-gray-100 dark:bg-gray-800 text-gray-400 flex items-center justify-center text-xl mb-3">
          <i class="fas fa-wrench"></i>
        </div>
        <p class="text-sm font-medium text-gray-600 dark:text-gray-300">
          {{ 'pages.custom-services.no_customServices' | translate }}
        </p>
      </div>
    }

  </div>
</div>
