<div class="w-full max-w-screen-md mx-auto px-3 sm:px-4 py-4 pb-16 space-y-4 animate-fadeIn">
	
	<!-- Cabecera Reutilizable con Botón de Atrás y Botón Añadir -->
	<app-page-header
		[title]="'pages.custom-services.title'"
		backRoute="/profile"
		[backTitle]="'pages.profile.title'"
	>
		<!-- Botón Añadir Servicio Personalizado -->
		<button 
			*ngIf="userSvc.user().customServices.length > 0"
			type="button" 
			(click)="goToAddCustomService()" 
			class="btn-primary !py-2 !px-3.5 !text-xs flex items-center gap-1.5 shadow-sm"
		>
			<i class="fas fa-plus text-[0.7rem]"></i>
			<span>{{ 'pages.custom-services.add_customService' | translate }}</span>
		</button>
	</app-page-header>

	<!-- Lista Agrupada de Servicios Personalizados -->
	<div *ngIf="userSvc.user().customServices.length > 0; else emptyState" class="card-container !p-0 overflow-hidden divide-y divide-gray-100 dark:divide-gray-700/60 shadow-sm">
		<div 
			*ngFor="let customService of userSvc.user().customServices" 
			class="flex items-center justify-between p-3.5 sm:p-4 bg-white dark:bg-gray-800 hover:bg-gray-50/80 dark:hover:bg-gray-700/60 transition-all duration-200 group"
		>
			<div class="flex items-center gap-3.5 min-w-0">
				<div class="w-10 h-10 rounded-xl bg-gray-50 dark:bg-gray-700/60 border border-gray-100 dark:border-gray-700/70 flex items-center justify-center text-base flex-shrink-0 shadow-2xs">
					<i [className]="customService.icon" [ngStyle]="{'color': customService.color || '#48d0b0'}"></i>
				</div>

				<span class="font-bold text-sm text-gray-900 dark:text-white truncate">
					{{ customService.label | capitalizeFirst }}
				</span>
			</div>

			<!-- Botón Eliminar Servicio Personalizado -->
			<button 
				type="button"
				(click)="removeCustomService(customService)"
				class="w-8 h-8 rounded-lg text-red-500 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-950/40 border border-transparent hover:border-red-200 dark:hover:border-red-900/50 flex items-center justify-center transition active:scale-95 shrink-0"
				title="Eliminar servicio"
			>
				<i class="fas fa-trash text-xs"></i>
			</button>
		</div>
	</div>

	<!-- Estado Vacío -->
	<ng-template #emptyState>
		<div class="card-container flex flex-col items-center justify-center text-center py-12 px-4 shadow-sm">
			<div class="w-14 h-14 rounded-2xl bg-primary-50 dark:bg-primary-950/40 text-primary-500 flex items-center justify-center text-2xl mb-4 border border-primary-100 dark:border-primary-900/30">
				<i class="fas fa-wrench"></i>
			</div>
			<h3 class="font-bold text-base text-gray-900 dark:text-white mb-1">
				{{ 'pages.custom-services.no_customServices' | translate }}
			</h3>
			<p class="text-xs text-gray-500 dark:text-gray-400 max-w-xs mb-6">
				{{ 'pages.profile.custom_services_desc' | translate }}
			</p>
			<button 
				type="button" 
				(click)="goToAddCustomService()" 
				class="btn-primary flex items-center gap-2 !py-2.5 !px-5"
			>
				<i class="fas fa-plus text-xs"></i>
				<span>{{ 'pages.custom-services.add_customService' | translate }}</span>
			</button>
		</div>
	</ng-template>

</div>
